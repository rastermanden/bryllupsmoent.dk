name: PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - if: github.event.action != 'closed'
        # CNAME must not end up inside the preview folder: the cleanup on PR
        # close rsyncs with --exclude CNAME, so a nested CNAME file would
        # survive and keep the stale pr-preview/pr-N folder alive forever.
        run: |
          npm ci
          npm run build -- --base=/pr-preview/pr-${{ github.event.number }}/
          rm -f dist/CNAME
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
